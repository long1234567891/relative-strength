name: Generate RS Ratings

# 원본: Fred6725/relative-strength (Apache License 2.0)
# 변경: 결과를 원작자 저장소/시드로 보내지 않고, 이 저장소의 history/cutoffs.csv 에 매일 커트라인 7개를 누적

on:
  schedule:
    - cron: '30 23 * * 1-5'   # 평일 23:30 UTC (한국 시간 다음날 오전 8:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Run RS calculation (원작자 코드 그대로) ──────────────────────────
      - name: Run relative strength calculation
        run: python relative-strength.py true

      # ── 5. 커트라인 7개를 history/cutoffs.csv 에 누적 ───────────────────────
      - name: Append cutoffs to history
        run: |
          python - <<'EOF'
          import os, datetime as dt
          from zoneinfo import ZoneInfo
          vals = []
          for line in open('output/RSRATING.csv'):
              p = line.strip().split(',')
              if len(p) < 5:
                  continue
              v = float(p[4])
              if v != 0 and v not in vals:
                  vals.append(v)
          vals.sort(reverse=True)
          if len(vals) != 7:
              raise SystemExit(f'RSRATING.csv 에서 커트라인 7개를 못 찾음: {vals}')
          now = dt.datetime.now(ZoneInfo('America/New_York'))
          day = now.date() if now.hour >= 16 else now.date() - dt.timedelta(days=1)
          while day.weekday() >= 5:
              day -= dt.timedelta(days=1)
          os.makedirs('history', exist_ok=True)
          path = 'history/cutoffs.csv'
          if not os.path.exists(path):
              open(path, 'w').write('date,t99,t90,t70,t50,t30,t10,t1\n')
          rows = open(path).read().splitlines()
          header, body = rows[0], [r for r in rows[1:] if r and not r.startswith(day.isoformat())]
          body.append(day.isoformat() + ',' + ','.join(str(round(v, 2)) for v in vals))
          body.sort()
          open(path, 'w').write('\n'.join([header] + body) + '\n')
          print('기록:', body[-1])
          EOF

      # ── 6. 이 저장소에 커밋 ─────────────────────────────────────────────────
      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add history/cutoffs.csv data_persist/ticker_info.json
          git diff --staged --quiet || git commit -m "RS cutoffs $(TZ=America/New_York date +'%Y-%m-%d')"
          git push
